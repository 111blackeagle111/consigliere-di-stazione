name: Build Windows executable

on:
  push:
    branches:
      - main
    paths:
      - "src/**"
      - "templates/**"
      - "requirements.txt"
      - "VERSION"
      - "build/**"
      - ".github/workflows/build-windows.yml"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: pr-tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run tests
        run: python -m unittest tests.test_ai

  build:
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller

      - name: Build executable
        run: pyinstaller build/consigliere.spec --clean --noconfirm

      - name: Verify executable
        shell: pwsh
        run: |
          if (-not (Test-Path "dist/ConsigliereDiStazione.exe")) {
            throw "Windows executable was not produced"
          }
          Get-Item "dist/ConsigliereDiStazione.exe" | Select-Object Name, Length

      - name: Upload executable artifact
        uses: actions/upload-artifact@v7
        with:
          name: ConsigliereDiStazione-windows
          path: dist/ConsigliereDiStazione.exe
          if-no-files-found: error
