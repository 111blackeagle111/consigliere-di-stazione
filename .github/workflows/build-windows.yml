name: Build Windows executable

on:
  push:
    branches:
      - main
    paths:
      - "src/**"
      - "templates/**"
      - "requirements.txt"
      - "VERSION"
      - "build/**"
      - ".github/workflows/build-windows.yml"
  workflow_dispatch:
    inputs:
      publish_binary:
        description: Commit the rebuilt executable to the repository
        required: true
        default: true
        type: boolean

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller

      - name: Build executable
        run: pyinstaller build/consigliere.spec --clean --noconfirm

      - name: Verify executable
        shell: pwsh
        run: |
          if (-not (Test-Path "dist/ConsigliereDiStazione.exe")) {
            throw "Windows executable was not produced"
          }
          Get-Item "dist/ConsigliereDiStazione.exe" | Select-Object Name, Length

      - name: Upload executable artifact
        uses: actions/upload-artifact@v7
        with:
          name: ConsigliereDiStazione-windows
          path: dist/ConsigliereDiStazione.exe
          if-no-files-found: error

      - name: Publish rebuilt executable
        if: ${{ github.event_name == 'push' || inputs.publish_binary }}
        shell: pwsh
        run: |
          Copy-Item "dist/ConsigliereDiStazione.exe" "ConsigliereDiStazione.exe" -Force
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ConsigliereDiStazione.exe
          git diff --cached --quiet
          if ($LASTEXITCODE -eq 0) {
            Write-Host "Executable is already up to date"
            exit 0
          }
          git commit -m "Rebuild Windows executable"
          git push
